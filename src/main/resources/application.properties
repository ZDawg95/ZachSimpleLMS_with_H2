spring.application.name=zachsimplelms

# File-backed embedded database. The data file is created beside the directory
# from which the application JAR is run and is reused after a restart.
spring.datasource.url=jdbc:h2:file:./data/zachsimplelms;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=zachary
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Useful for the assessment demo: open /h2-console in a browser.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
